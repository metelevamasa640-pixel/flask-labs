<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Лабораторная №3</title>
        <style>
            table {
                border-collapse: collapse;
                width: 750px;
                margin: 20px auto;
                text-align: center;
                background-color: #f5f5f5;
            }
            .train-table {
                width: 750px;
                margin: 20px auto;
                border: 1px solid gray;
                border-collapse: separate;
                border-spacing: 2px;
                background-color: #cfcfcf;
            }

            .train-table th,
            .train-table td {
                border: 1px solid white;
                padding: 4px 8px;
                text-align: center;
            }

            .train-table th {
                background-color: #bfbfbf;
            }

            .train-table td {
                background-color: #ffffff;
            }
        </style>
    </head>
    <body>
        <p style="text-align: center;"><em>Расписание поездов</em></p>
        <table class="train-table">
            <tr>
                <th rowspan="2">Станция</th>
                <th colspan="3">N1 "Россия"</th>
                <th colspan="3">N25 "Сибиряк"</th>
            </tr>
            <tr>
                <th>Приб.</th>
                <th>Стоянка</th>
                <th>Отпр.</th>
                <th>Приб.</th>
                <th>Стоянка</th>
                <th>Отпр.</th>
            </tr>
            <tr>
                <td>Новосибирск</td>
                <td>17:26</td>
                <td>20</td>
                <td>17:46</td>
                <td></td>
                <td></td>
                <td>9:00</td>
            </tr>
        </table>
    </body>
</html>
