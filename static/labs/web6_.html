<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лабораторная работа №6</title>
    <style>
        body {
            background: #dcdcdc;
            margin: 0;
        }
        table {
            width: 100%;
            height: 100vh;
            border-collapse: collapse;
        }
        .left {
            width: 50%;
            padding: 10px;
            border-right: 6px solid gray;
            text-align: center;
            vertical-align: middle;
        }
        .right {
            width: 50%;
            vertical-align: top;
            padding: 15px;
        }
        h3 {
            font-size: 24px;
            margin: 0;
        }
    </style>
</head>
<body>
<table>
    <tr>
        <td class="left">
            <img src="mozaika.webp" width="270" height="475" alt="Глобус">
        </td>
        <td class="right">
            <h3>Это глобус</h3>
        </td>
    </tr>
</table>
</body>
</html>
